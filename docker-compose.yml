# Local PostgreSQL; POSTGRES_PASSWORD comes from .env and db_data persists data.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "jagent", "-d", "jagent"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: jagent
      POSTGRES_DB: jagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
