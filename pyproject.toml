# Project metadata; dependencies support PostgreSQL and scripts expose the CLI.
[project]
name = "jagent"
version = "0.1.0"
description = "Personal job-search pipeline"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
jagent = "jagent.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
