# Project metadata; dependencies support PostgreSQL and scripts expose the CLI.
[project]
name = "jagent"
version = "0.1.0"
description = "Personal job-search pipeline"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
jagent = "jagent.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
