atformë si për punëdhënësit ashtu edhe për ata që kerkojnë punë\",\"your_career_search_jobs\":\"Kërkoni punë\",\"your_career_post_jobs\":\"Postoni punë\",\"your_career_feature_1_title\":\"Regjistrohuni dhe krijoni profilin tuaj\",\"your_career_feature_1_description\":\"Shfletoni mijëra mundësi pune dhe projekte të personalizuara sipas aftësive dhe eksperiencave tuaja.\",\"your_career_feature_2_title\":\"Posto punë ose projekte\",\"your_career_feature_2_description\":\"Publiko punë ose projekte dhe lidhu me kandidatë të verifikuar që përputhen me nevojat e biznesit.\",\"your_career_feature_3_title\":\"Gjej kandidatët e duhur\",\"your_career_feature_3_description\":\"Ne thjeshtojmë procesin e punësimit duke krijuar një hapësirë unike ku kandidatët dhe kompanitë bashkohen.\",\"your_career_register\":\"Regjistrohuni\",\"what_we_do_1_title\":\"Mijëra mundësi pune\",\"what_we_do_1_description\":\"Shfletoni çdo ditë qindra shpallje pune dhe projekte të reja.\",\"what_we_do_2_title\":\"Thjeshtësi në aplikim\",\"what_we_do_2_description\":\"Krijoni profilin, aplikoni me një klikim dhe gjurmoni çdo aplikim nga një panel i vetëm.\",\"what_we_do_3_title\":\"Gjurmoni ecurinë në kohë reale\",\"what_we_do_3_description\":\"Shikoni sa aplikime keni dërguar, sa janë parë nga punëdhënësit dhe merrni rekomandime për pozicione që ju përshtaten.\",\"stat_card_active_jobs\":\"Punë aktive\",\"stat_card_open_projects\":\"Projekte të hapura\",\"stat_card_registered_candidates\":\"Kandidatë të regjistruar\",\"stat_card_partner_companies\":\"Kompani partnere\",\"stat_card_since_last_year\":\"nga viti i kaluar\",\"testimonial_quote_1\":\"Falë Staff, arrita të gjej projektin tim të parë si freelancer brenda pak ditësh. Platformë e thjeshtë, e shpejtë dhe me mundësi reale.\",\"testimonial_role_1\":\"UI/UX Designer\",\"testimonial_type_1\":\"Freelancer\",\"testimonial_quote_2\":\"Staff më ndihmoi të gjej punë të përhershme si zhvillues brenda një jave. Procesi ishte shumë i lehtë dhe kompania ishte profesionale.\",\"testimonial_role_2\":\"Full-Stack Developer\",\"testimonial_type_2\":\"Punëmarrës\",\"testimonial_quote_3\":\"Si kompani, Staff na ka dhënë akses në talente cilësore shqiptare. Kemi punësuar 3 persona në 2 muaj të fundit përmes platformës.\",\"testimonial_role_3\":\"HR Manager\",\"testimonial_type_3\":\"Kompani\",\"testimonial_quote_4\":\"Më pëlqen se Staff ofron mundësi si për punë të përhershme ashtu edhe për projekte freelance. Gjeta pikërisht atë që kërkoja!\",\"testimonial_role_4\":\"Marketing Specialist\",\"testimonial_type_4\":\"Freelancer\",\"testimonial_quote_5\":\"Platformë moderne dhe funksionale. Si punëdhënës, Staff na ka kursyer kohë dhe na ka lidhur me kandidatë të kualifikuar shumë shpejt.\",\"testimonial_role_5\":\"CEO\",\"testimonial_type_5\":\"Kompani\",\"testimonial_quote_6\":\"Pas muajsh kërkimi, Staff më ndihmoi të gjej mundësinë e duhur në fushën time. Rekomandueshëm për çdo profesionist që kërkon punë.\",\"testimonial_role_6\":\"Graphic Designer\",\"testimonial_type_6\":\"Punëmarrës\",\"download_banner_title\":\"Merr Staff kudo me vete\",\"download_banner_subtitle\":\"Shkarko aplikacionin në App Store ose Play Store dhe fillo sot udhëtimin tënd profesional.\",\"download_banner_subtitle_short\":\"Shkarko aplikacionin në App Store dhe Play Store\",\"download_banner_cta\":\"Shkarko\",\"download_banner_store_prefix\":\"Shkarko në\",\"download_title_prefix\":\"Shkarko aplikacionin\",\"download_title_highlight\":\"Staff\",\"download_description\":\"Menaxho karrierën tënde nga kudo. Kërko punë, apliko me një klikim dhe ndiq aplikimet e tua drejtpërdrejt nga telefoni.\",\"download_feature_1\":\"Njoftime në kohë reale për punë të reja\",\"download_feature_2\":\"Apliko dhe ndiq statusin me një klikim\",\"download_feature_3\":\"Bisedo drejtpërdrejt me punëdhënësit\",\"download_available_on\":\"E disponueshme në\",\"download_now\":\"Shkarko tani\"},\"about\":{\"hero_title_brand\":\"Staff\",\"hero_title_rest\":\" - Qindra profesionistë, dhjetra kompani, një platformë qe i lidh të gjitha.\",\"hero_paragraph_1\":\"Në Staff, besojmë se çdo talent meriton mundësinë e duhur. Pasi pamë një hendek mes profesionistëve të kualifikuar që kërkojnë mundësi dhe kompanive që kërkojnë talentet e duhura, krijuam staff si zgjidhje.\",\"hero_paragraph_2\":\"Staff është ura lidhëse që kthen kërkimin në mundësi, dhe mundësitë në sukses. Profesionistët ngarkojnë CV-në, kompanitë publikojnë nevojat e tyre, dhe ne sigurojmë që përputhja të ndodhë shpejt pa humbur kohe.\",\"hero_browse_jobs\":\"Shfletoni punët\",\"hero_browse_projects\":\"Shfletoni projektet\",\"how_we_arrived_title\":\"Si erdhëm deri këtu?\",\"how_we_arrived_subtitle\":\"Staff nuk u krijua rastësisht. U krijua nga përvoja e munguar dhe nevoja që pamë në treg për një zgjidhje reale.\",\"how_we_arrived_problems_title\":\"Problemet që vumë re dhe zgjidhja jonë:\",\"how_we_arrived_problem_1_title\":\"Humbje kohe\",\"how_we_arrived_problem_1_text\":\"Pamë se profesionistët humbnin kohë duke kërkuar në platform të shumta dhe jo transparente.\",\"how_we_arrived_problem_2_title\":\"Mungesë referimesh\",\"how_we_arrived_problem_2_text\":\"Kompanitë luftonin për të gjetur talentet e duhura në kohën e duhur, duke bërë kështu zgjedhje të gabuara për bisnesin e tyre.\",\"how_we_arrived_solution_title\":\"Zgjidhja\",\"how_we_arrived_solution_text\":\"Krijuam Staff duke menduar për të dyja palët dhe ndërtuam një platformë që përputh nevojat dhe kërkesat e të gjitha palëve të përfshira duke dhënë zgjidhje të shpejtë, efikase dhe transparencë.\",\"join_staff_title\":\"Bashkohuni me mijëra profesionistë të talentuar në Staff.\",\"join_staff_subtitle\":\"Këtu profesionistët hedhin hapin e parë drejt karrierës së ëndrrave, ndërsa kompanitë gjejnë talentet e duhura për ekipet e tyre.\",\"join_staff_register_now\":\"Regjistrohuni tani\",\"opportunity_badge\":\"Veçoritë\",\"opportunity_title_text\":\"Platforma që ju lidh me\",\"opportunity_title_highlight\":\" mundësi reale pune\",\"opportunity_subtitle\":\"Zgjidhja jonë është një platformë që bën lidhjet e duhura shpejt, thjeshtë dhe efektivisht. Qoftë për punë të përhershme, projekte freelancing apo bashkëpunime afatshkurtra me kompani të besueshme.\",\"what_we_do_register\":\"Regjistrohuni\",\"testimonials_title_highlight\":\"Zërat\",\"testimonials_title_rest\":\" e atyre që kanë zgjedhur Staff\",\"testimonials_subtitle\":\"Lexoni çfarë thonë kompanitë që përdorin Staff çdo ditë.\",\"company_testimonial_1\":\"Staff na ndihmoi të gjejmë një Frontend Developer të shkëlqyer për TechAlb. Brenda një jave kishim kandidatë të kualifikuar dhe procesin e punësimit e përfunduam shpejt.\",\"company_testimonial_2\":\"Falë Staff-it, në Digital Solutions kemi punësuar 3 profesionistë të talentuar në 2 muaj. Platforma ofron akses në kandidatë cilësorë dhe procesi është shumë profesional.\",\"company_testimonial_3\":\"InnovateLab ka gjetur UX Designer-in perfekt nëpërmjet Staff. Platforma na kurseu kohë dhe na lidhi me talente që nuk do t'i gjenin dot ndryshe.\",\"company_testimonial_4\":\"Si kompani teknologjike, DataWorks ka nevojë për talente të specializuara. Staff na ka ofruar zgjidhjen më të mirë për të gjetur zhvillues të kualifikuar shpejt dhe efikasishëm.\",\"company_testimonial_5\":\"CloudTech punësoi 2 Cloud Engineers përmes Staff-it dhe jemi jashtëzakonisht të kënaqur. Cilësia e kandidatëve dhe shpejtësia e procesit janë impresionuese.\",\"company_testimonial_6\":\"Rekomandueshëm për çdo kompani që kërkon talente! CreativeHub ka gjetur Content Strategist-in ideal falë Staff. Platformë moderne dhe rezultate konkrete.\"},\"contact\":{\"heading\":\"Na kontaktoni\",\"subheading\":\"Jemi gjithmonë gati t’ju ndihmojmë dhe t’ju përgjigjemi pyetjeve tuaja.\",\"other_ways_title\":\"Na gjeni edhe përmes:\",\"email_card_title\":\"Email-it\",\"phone_card_title\":\"Numër telefoni\",\"whatsapp_card_title\":\"Whatsapp\",\"name_label\":\"Emri\",\"name_placeholder\":\"Emri\",\"surname_label\":\"Mbiemri in tonë të kontaktit.\",\"project_list_title\":\"Projektet më të Fundit\",\"project_list_description\":\"Shfleto projektet dhe mundësitë e fundit në Staff.al. Zbulo projekte pune nga kompanitë shqiptare dhe ndërkombëtare.\",\"job_list_title\":\"Oferta Pune\",\"job_list_description\":\"Shfleto mbi 10,000 oferta pune aktive në Staff.al. Gjej punën e duhur sipas qytetit, industrisë dhe nivelit të përvojës. Apliko lehtë dhe shpejt.\",\"companies_title\":\"Kompanitë që po punësojnë\",\"companies_description\":\"Zbulo kompanitë që po punësojnë në Staff.al dhe apliko në punët e tyre aktive. Gjej punëdhënësin e duhur sipas industrisë dhe vendndodhjes.\",\"settings_title\":\"Cilësimet\"},\"cookies\":{\"aria_label\":\"Njoftim për cookie\",\"title_prefix\":\"Ne përdorim\",\"title_highlight\":\"cookie\",\"description\":\"Përdorim cookie për të përmirësuar përvojën tënde, për të analizuar trafikun dhe për të personalizuar përmbajtjen.\",\"learn_more\":\"Mëso më shumë\",\"accept\":\"Prano\",\"reject\":\"Refuzo\",\"close\":\"Mbyll\"},\"deleteAccount\":{\"meta_title\":\"Fshirja e Llogarisë\",\"meta_description\":\"Si të fshini llogarinë tuaj në Staff.al — hapat në aplikacion dhe në web, kërkesa me email, të dhënat që fshihen dhe afatet e përpunimit.\",\"hero_title_highlight\":\"Fshirja e llogarisë\",\"hero_title_rest\":\" në Staff.al\",\"hero_intro\":\"Ju mund ta fshini llogarinë tuaj në çdo moment, direkt nga aplikacioni ose nga faqja e internetit. Më poshtë gjeni hapat konkretë, çfarë ndodh me të dhënat tuaja dhe sa kohë zgjat procesi.\",\"app_title\":\"Fshirja nga aplikacioni mobil\",\"app_step_1\":\"Hapni aplikacionin Staff dhe identifikohuni me llogarinë tuaj.\",\"app_step_2\":\"Shkoni te skeda 'Profili' në menunë e poshtme.\",\"app_step_3\":\"Zgjidhni 'Llogaria'.\",\"app_step_4\":\"Shtypni butonin 'Fshij Llogarinë'.\",\"app_step_5\":\"Zgjidhni arsyen e fshirjes dhe konfirmoni duke shtypur 'Fshije'.\",\"web_title\":\"Fshirja nga faqja e internetit\",\"web_step_1\":\"Identifikohuni në staff.al me llogarinë tuaj.\",\"web_step_2\":\"Klikoni mbi foton e profilit lart djathtas dhe zgjidhni menunë e profilit.\",\"web_step_3\":\"Zgjidhni 'Llogaria'.\",\"web_step_4\":\"Klikoni butonin 'Fshij Llogarinë'.\",\"web_step_5\":\"Zgjidhni arsyen e fshirjes dhe konfirmoni duke klikuar 'Fshije'.\",\"email_title\":\"Nëse nuk keni akses në llogari\",\"email_intro\":\"Nëse nuk arrini të identifikoheni ose nuk keni më akses në aplikacion, mund të kërkoni fshirjen e llogarisë me email.\",\"email_step_1\":\"Dërgoni një email në info@staff.al nga adresa e email-it me të cilën keni regjistruar llogarinë.\",\"email_step_2\":\"Përdorni si subjekt: 'Kërkesë për fshirjen e llogarisë'.\",\"email_step_3\":\"Shkruani emrin dhe mbiemrin tuaj, si dhe numrin e telefonit të regjistruar në llogari.\",\"email_verify_note\":\"Për arsye sigurie, ne verifikojmë identitetin tuaj përpara se të vazhdojmë. Kërkesa duhet të vijë nga email-i i regjistruar; nëse kjo nuk është e mundur, mund t'ju kërkojmë të konfirmoni numrin e telefonit të lidhur me llogarinë. Nuk fshijmë asnjë llogari pa e verifikuar identitetin e kërkuesit.\",\"deleted_title\":\"Të dhënat që fshihen\",\"deleted_item_1\":\"Profili juaj dhe të dhënat personale (emri, email-i, telefoni, data e lindjes, qyteti)\",\"deleted_item_2\":\"CV-ja juaj dhe të gjitha dokumentet e ngarkuara\",\"deleted_item_3\":\"Aplikimet tuaja për punë dhe historiku i tyre\",\"deleted_item_4\":\"Bisedat dhe mesazhet me punëdhënësit\",\"deleted_item_5\":\"Njoftimet dhe preferencat e njoftimeve për punë\",\"deleted_item_6\":\"Punët e ruajtura dhe kërkimet e ruajtura\",\"retained_title\":\"Të dhënat që ruhen\",\"retained_item_1\":\"Të dhënat e faturimit dhe faturat (për llogaritë e kompanive) ruhen për 5 vjet, siç kërkohet nga legjislacioni tatimor dhe kontabël.\",\"retained_item_2\":\"Statistika të anonimizuara dhe të grumbulluara, të cilat nuk lejojnë identifikimin tuaj.\",\"retained_item_3\":\"Regjistri i vetë kërkesës për fshirje, si provë e përmbushjes së detyrimit ligjor.\",\"retained_note\":\"Të dhënat e ruajtura nuk përdoren më për qëllime marketingu apo profilizimi dhe fshihen automatikisht pas përfundimit të afatit ligjor.\",\"timeline_title\":\"Sa kohë zgjat\",\"timeline_text\":\"Llogaria juaj çaktivizohet menjëherë pas konfirmimit dhe nuk është më e dukshme për punëdhënësit. Fshirja e plotë e të dhënave nga sistemet tona përfundon brenda 30 ditëve nga momenti i kërkesës. Kopjet e sigurisë (backup) fshihen brenda të njëjtit cikël.\",\"grace_title\":\"A mund të kthehet mbrapsht\",\"grace_text\":\"Brenda 14 ditëve nga kërkesa, mund ta rikuperoni llogarinë duke u identifikuar përsëri ose duke na kontaktuar në info@staff.al. Pas këtij afati, fshirja është përfundimtare dhe të dhënat nuk mund të rikthehen.\",\"contact_title\":\"Keni pyetje?\",\"contact_text\":\"Për çdo pyetje rreth fshirjes së llogarisë ose të dhënave tuaja personale, na kontaktoni:\",\"contact_email\":\"info@staff.al\",\"contact_phone\":\"+355672002800\",\"contact_privacy_link\":\"Lexoni Politikën e Privatësisë\"}},\"now\":\"$undefined\",\"timeZone\":\"UTC\",\"children\":\"$L2b\"}]\n"])</script><script>self.__next_f.push([1,"2b:[\"$\",\"$L2c\",null,{\"children\":[\"$\",\"$L2d\",null,{\"clientId\":\"725689146955-p979d4edt0551o18v84hkeo6ro31620n.apps.googleusercontent.com\",\"children\":[[\"$\",\"$L2e\",null,{\"children\":[[\"$\",\"$L2f\",null,{}],[\"$\",\"$L30\",null,{}],[\"$\",\"$L31\",null,{\"children\":[\"$\",\"$L32\",null,{\"children\":[\"$\",\"$L33\",null,{\"children\":[[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L34\",null,{\"children\":[\"$\",\"$L3\",null,{}]}],\"templateStyles\":[],\"templateScripts\":[[\"$\",\"script\",\"script-0\",{\"src\":\"/_next/static/chunks/0.5~oxsgf3ucn.js\",\"async\":true}]],\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}],[\"$\",\"$L35\",nu
